services:
  taxol760:
    image: maven:3.9.14-eclipse-temurin-17
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
    volumes:
      - .:/app
      - taxol760-maven-cache:/root/.m2
    working_dir: /app
    command: mvn spring-boot:run
    depends_on:
      taxol760-db:
        condition: service_healthy
      taxol760-redis:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8080}:8080"

  taxol760-db:
    image: postgres:16-alpine
    env_file:
      - .env
    volumes:
      - taxol760-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  taxol760-redis:
    image: redis:7.2-alpine
    volumes:
      - taxol760-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  taxol760-db-data:
  taxol760-redis-data:
  taxol760-maven-cache: